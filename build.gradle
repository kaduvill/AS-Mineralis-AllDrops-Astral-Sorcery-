import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask

plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = project.mod_group
version = project.mod_version

base {
    archivesName.set('ASJeiAllDrops')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
        vendor.set(JvmVendorSpec.AZUL)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Developer')
    javaCompatibilityVersion.set(8)
    jvmLanguageVersion.set(JavaLanguageVersion.of(8))
    injectedTags.put('VERSION', project.version.toString())
    injectedTags.put('MC_VERSION', mcVersion.get())
}

tasks.named('injectTags', InjectTagsTask) {
    outputClassName.set('com.kaduvill.asjeialldrops.Tags')
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = uri('https://cursemaven.com')
            }
        }
        filter {
            includeGroup('curse.maven')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation(rfg.deobf('curse.maven:astral-sorcery-241721:3044416')) {transitive = false}
    implementation(rfg.deobf('curse.maven:baubles-227083:2518667')) {transitive = false}


    /// HEI versions
    implementation(rfg.deobf('maven.modrinth:had-enough-items:4.31.2')) {transitive = false}
    // implementation(rfg.deobf('maven.modrinth:had-enough-items:4.36.0')) {transitive = false }
}

tasks.named('test', Test) {
    useJUnit()
    def testWork = layout.buildDirectory.dir('test-work')
    workingDir(testWork)
    doFirst { testWork.get().asFile.mkdirs() }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile) {
    options.release.set(8)
}

tasks.named('compileInjectedTagsJava', JavaCompile) {
    options.release.set(8)
}

processResources {
    inputs.property('version', project.version.toString())
    inputs.property('mcversion', minecraft.mcVersion.get())
    filesMatching('mcmod.info') {
        expand(version: project.version.toString(), mcversion: minecraft.mcVersion.get())
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
}
